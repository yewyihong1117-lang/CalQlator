<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Casio fx-570 Scientific Calculator</title>
    <meta name="description" content="Interactive, mobile-first scientific web calculator modeled after the Casio fx-570 EX / ES Plus with natural textbook display, tactile keypads, and swipeable advanced mode drawers." />
    <meta property="og:title" content="Casio fx-570 Scientific Calculator" />
    <meta property="og:description" content="Interactive, mobile-first scientific web calculator modeled after the Casio fx-570 EX / ES Plus with natural textbook display, tactile keypads, and swipeable advanced mode drawers." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#0D0D0D" />
  </head>
  <body class="bg-[#0A0A0C] text-slate-100 antialiased selection:bg-amber-500/30 selection:text-amber-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then((reg) => {
            reg.update();
          });
        });
      }
    </script>
  </body>
</html>
