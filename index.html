<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0E0B16" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="fx-570EX" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <title>Casio fx-570 Scientific Calculator</title>
    <meta name="description" content="Interactive, mobile-first scientific web calculator modeled after the Casio fx-570 EX / ES Plus with natural textbook display, tactile keypads, and swipeable advanced mode drawers." />
    <meta property="og:title" content="Casio fx-570 Scientific Calculator" />
    <meta property="og:description" content="Interactive, mobile-first scientific web calculator modeled after the Casio fx-570 EX / ES Plus with natural textbook display, tactile keypads, and swipeable advanced mode drawers." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body class="bg-[#0A0A0C] text-slate-100 antialiased font-sans selection:bg-amber-500/30 selection:text-amber-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        const hadController = Boolean(navigator.serviceWorker.controller);
        let reloading = false;

        const showUpdateToast = () => {
          if (document.getElementById('pwa-update-toast')) return;
          const toast = document.createElement('div');
          toast.id = 'pwa-update-toast';
          toast.setAttribute('role', 'alert');
          toast.textContent = 'Updated, tap to reload';
          toast.style.cssText = [
            'position: fixed',
            'bottom: 24px',
            'left: 50%',
            'transform: translateX(-50%)',
            'z-index: 99999',
            'background: #1C1C24',
            'color: #EDE7FF',
            'padding: 10px 18px',
            'border-radius: 9999px',
            'font-size: 13px',
            'font-weight: 500',
            'font-family: system-ui, -apple-system, sans-serif',
            'box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5)',
            'cursor: pointer',
            'border: 1px solid rgba(255, 255, 255, 0.12)',
            'user-select: none',
            '-webkit-user-select: none',
            'pointer-events: auto',
            'display: flex',
            'align-items: center',
            'gap: 8px'
          ].join(';');

          toast.addEventListener('click', () => {
            if (reloading) return;
            reloading = true;
            toast.textContent = 'Reloading...';
            window.location.reload();
          });

          document.body.appendChild(toast);
        };

        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (!hadController) return;
          if (reloading) return;
          showUpdateToast();
        });

        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then((reg) => {
            reg.update().catch(() => {});

            document.addEventListener('visibilitychange', () => {
              if (document.visibilityState === 'visible') {
                reg.update().catch(() => {});
              }
            });
          }).catch((err) => {
            console.error('Service worker registration failed:', err);
          });
        });
      }
    </script>
  </body>
</html>
